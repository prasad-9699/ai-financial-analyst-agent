[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 50
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#2DD4BF"
backgroundColor = "#080C18"
secondaryBackgroundColor = "#0F1629"
textColor = "#E2E8F0"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"
